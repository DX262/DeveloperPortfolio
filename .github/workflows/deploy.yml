
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular portfolio
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          BUILD_INDEX=$(find dist -type f -name index.html | head -n 1)

          if [ -z "$BUILD_INDEX" ]; then
            echo "ERROR: Angular index.html not found"
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_INDEX")
          echo "Angular build directory: $BUILD_DIR"

          mkdir -p _site
          cp -a "$BUILD_DIR"/. _site/

          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
